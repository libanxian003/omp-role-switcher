<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>omp 设置中心</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #16181d;
         color: #d7dae0; margin: 0 auto; padding: 20px; max-width: 860px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b93a1; font-size: 12px; margin-bottom: 14px; word-break: break-all; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { background: #232732; border: 1px solid #3a4050; color: #8b93a1;
                 border-radius: 8px; padding: 7px 18px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
  .role { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
          border: 1px solid #2a2e37; border-radius: 8px; margin-bottom: 8px; background: #1c1f26; }
  .role .name { width: 110px; font-weight: 600; }
  .role .name small { display: block; font-weight: 400; color: #8b93a1; font-size: 11px; }
  .role .value { flex: 1; font-family: Consolas, monospace; font-size: 13px; color: #9fd0ff; }
  select { background: #232732; color: #d7dae0; border: 1px solid #3a4050;
           border-radius: 6px; padding: 6px 8px; font-size: 13px; display: none;
           max-width: 360px; }
  select.group { min-width: 180px; max-width: 220px; }
  .role.editing { flex-wrap: wrap; }
  .role.editing select { display: inline-block; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px;
           padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; border: 1px solid #3a4050; color: #8b93a1; }
  button:hover { filter: brightness(1.15); }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #234; padding: 10px 16px;
           border-radius: 8px; display: none; font-size: 13px; border: 1px solid #3a4050; }
  #toast.bad { background: #4a1d1d; border-color: #a33; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 240px; background: #232732; color: #d7dae0;
           border: 1px solid #3a4050; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  .toolbar label { font-size: 12px; color: #8b93a1; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .grp { margin: 16px 0 6px; font-size: 14px; font-weight: 700; color: #9fc3ff;
         border-bottom: 1px solid #2a2e37; padding-bottom: 4px; }
  .grp small { color: #6b7280; font-weight: 400; margin-left: 8px; }
  .row { border: 1px solid #242833; border-radius: 8px; background: #1c1f26;
         padding: 8px 12px; margin-bottom: 6px; }
  .row .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row .zhname { font-size: 13px; font-weight: 600; min-width: 150px; }
  .row .key { font-family: Consolas, monospace; font-size: 11px; color: #6b7280; }
  .row .badge { font-size: 10px; border-radius: 4px; padding: 1px 6px; }
  .badge.custom { background: #274a2d; color: #8ee08e; }
  .badge.default { background: #2b2f3a; color: #6b7280; }
  .badge.ro { background: #4a3a1d; color: #e0c98e; }
  .row input[type=text] { background: #232732; color: #d7dae0; border: 1px solid #3a4050;
           border-radius: 6px; padding: 5px 8px; font-size: 12px; width: 220px;
           font-family: Consolas, monospace; }
  .row select { display: inline-block; width: auto; min-width: 90px; }
  .row .desc { font-size: 11px; color: #8b93a1; margin-top: 4px; line-height: 1.5; }
  .row .save { padding: 4px 12px; font-size: 12px; }
  .row input:disabled, .row select:disabled { opacity: .45; }
  .count { font-size: 12px; color: #6b7280; }
  .settings-layout { display: flex; gap: 14px; align-items: flex-start; }
  #group-nav { flex: 0 0 200px; width: 200px; position: sticky; top: 12px;
               max-height: calc(100vh - 60px); overflow-y: auto;
               background: #1c1f26; border: 1px solid #2a2e37; border-radius: 8px; padding: 6px; }
  .nav-item { display: flex; justify-content: space-between; align-items: center; gap: 6px;
              padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #9aa2b1; }
  .nav-item:hover { background: #232732; color: #d7dae0; }
  .nav-item.active { background: #2d6cdf; color: #fff; }
  .nav-item.dim { opacity: .35; }
  .nav-item .gname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .cnt { flex: none; font-size: 10px; color: #6b7280; background: #232732;
                   border-radius: 8px; padding: 0 6px; min-width: 14px; text-align: center; }
  .nav-item.active .cnt { background: rgba(255,255,255,.18); color: #fff; }
  #settings { flex: 1; min-width: 0; }
  .empty-hint { color: #6b7280; font-size: 13px; padding: 24px 0; text-align: center; }
  @media (max-width: 700px) {
    .settings-layout { flex-direction: column; }
    #group-nav { position: static; width: auto; flex: none; max-height: none;
                 align-self: stretch; max-width: 100%;
                 display: flex; overflow-x: auto; overflow-y: hidden; gap: 4px; padding: 4px; }
    .nav-item { flex: 0 0 auto; }
    .nav-item .gname { white-space: nowrap; }
  }
</style>
</head>
<body>
<h1>omp 设置中心</h1>
<div class="sub" id="cfg"></div>
<div class="tabs">
  <button id="tab-roles" class="active">模型角色</button>
  <button id="tab-settings">全部设置</button>
</div>
<div id="view-roles"></div>
<div id="view-settings" style="display:none">
  <div class="toolbar">
    <input type="text" id="q" placeholder="搜索：键名 / 中文名 / 描述…">
    <label><input type="checkbox" id="onlyCustom"> 只看已自定义</label>
    <span class="count" id="count"></span>
  </div>
  <div class="settings-layout">
    <nav id="group-nav"></nav>
    <div id="settings"></div>
  </div>
</div>
<div id="toast"></div>
<script>
let models = [], settingsCache = [];
const roleComment = {"default":"主会话模型","smol":"轻量快速任务","slow":"深度推理",
  "plan":"规划模式","vision":"图像理解","task":"子代理","commit":"提交信息生成",
  "tiny":"极小分类/标题","web":"网络搜索","advisor":"顾问评审"};

/* ---------- 通用 ---------- */
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  t.className = bad ? 'bad' : '';
  setTimeout(() => t.style.display = 'none', 4000);
}
document.getElementById('tab-roles').onclick = () => switchTab('roles');
document.getElementById('tab-settings').onclick = () => switchTab('settings');
function switchTab(which) {
  document.getElementById('tab-roles').classList.toggle('active', which === 'roles');
  document.getElementById('tab-settings').classList.toggle('active', which === 'settings');
  document.getElementById('view-roles').style.display = which === 'roles' ? '' : 'none';
  document.getElementById('view-settings').style.display = which === 'settings' ? '' : 'none';
  if (which === 'settings' && !document.getElementById('settings').childElementCount) loadSettings();
}

/* ---------- 模型角色 ---------- */
async function load() {
  const r = await fetch('/api/state').then(x => x.json());
  models = r.models;
  document.getElementById('cfg').textContent = r.config + ' · 共 ' + r.models.length + ' 个可用模型';
  const box = document.getElementById('view-roles');
  box.innerHTML = '';
  for (const [role, value] of Object.entries(r.roles)) {
    box.appendChild(roleRow(role, value));
  }
}

function roleRow(role, value) {
  const div = document.createElement('div');
  div.className = 'role';
  const groups = {};
  for (const m of models) (groups[m.provider] ??= []).push(m);
  const gsel = document.createElement('select');
  gsel.className = 'group';
  for (const [p, list] of Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]))) {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = `${p} (${list.length})`;
    gsel.appendChild(o);
  }
  const inCatalog = models.some(m => m.selector === value);
  if (!inCatalog) {
    const o = document.createElement('option');
    o.value = '__current__';
    o.textContent = `(当前) ${value}`;
    gsel.prepend(o);
  }
  const msel = document.createElement('select');
  function fillModels(group) {
    msel.innerHTML = '';
    const list = group === '__current__' ? [] : groups[group] || [];
    for (const m of list) {
      const o = document.createElement('option');
      o.value = m.selector;
      o.textContent = m.name + '  (' + m.selector + ')';
      msel.appendChild(o);
    }
    if (group === '__current__') {
      const o = document.createElement('option');
      o.value = value; o.textContent = value; o.selected = true;
      msel.appendChild(o);
    }
  }
  gsel.onchange = () => fillModels(gsel.value);
  gsel.value = inCatalog ? (models.find(m => m.selector === value)?.provider ?? Object.keys(groups)[0])
                         : '__current__';
  fillModels(gsel.value);
  if (inCatalog) msel.value = value;
  div.innerHTML = `<div class="name">${role}<small>${roleComment[role]||''}</small></div>
                   <div class="value"></div>`;
  div.querySelector('.value').textContent = value;
  const edit = document.createElement('button');
  edit.textContent = '切换';
  edit.onclick = () => {
    div.classList.add('editing');
    div.append(gsel, msel);
    edit.style.display = 'none';
    const ok = document.createElement('button'); ok.textContent = '保存';
    const no = document.createElement('button'); no.textContent = '取消'; no.className = 'ghost';
    ok.onclick = async () => {
      const r = await fetch('/api/set', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({role, value: msel.value})}).then(x => x.json());
      toast(r.ok ? `${role} → ${msel.value}（已备份 config.yml，即时生效）` : ('失败: ' + r.error), !r.ok);
      load();
    };
    no.onclick = () => load();
    div.append(ok, no);
  };
  div.appendChild(edit);
  return div;
}

/* ---------- 全部设置 ---------- */
let curGroup = null;        // 当前选中的大类
let preSearchGroup = null;  // 搜索前所在大类，清空搜索时恢复
let groupMap = {};          // __groupmap 语义归组：键或命名空间前缀 → 大类名

function groupNameFor(key, fallback) {
  if (groupMap[key]) return groupMap[key]; // 1) 精确键优先
  let best = null, bestLen = -1;
  for (const p in groupMap) {
    if (key.length > p.length && key[p.length] === '.' &&
        key.startsWith(p) && p.length > bestLen) {
      best = groupMap[p]; bestLen = p.length; // 2) 最长命名空间前缀
    }
  }
  if (best) return best;
  return fallback;                          // 3) 回退 __groups（服务端组名）
}

function groupList() {
  const totals = new Map();
  for (const it of settingsCache) totals.set(it.group, (totals.get(it.group) || 0) + 1);
  return [...totals.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const onlyCustom = document.getElementById('onlyCustom').checked;
  return settingsCache.filter(it =>
    (!onlyCustom || it.custom) &&
    (!q || it.key.toLowerCase().includes(q) ||
     (it.name || '').includes(q) || (it.zh || '').includes(q) ||
     (it.desc || '').toLowerCase().includes(q)));
}

function hitsByGroup() {
  const hits = new Map();
  for (const it of filtered()) hits.set(it.group, (hits.get(it.group) || 0) + 1);
  return hits;
}

function isFiltering() {
  return document.getElementById('q').value.trim() !== '' ||
         document.getElementById('onlyCustom').checked;
}

function applyFilter(jump) {
  const searching = document.getElementById('q').value.trim() !== '';
  if (searching && preSearchGroup === null) preSearchGroup = curGroup;
  if (!searching && preSearchGroup !== null) { // 清空搜索 → 回到搜索前的分类
    curGroup = preSearchGroup; preSearchGroup = null;
  }
  const hits = hitsByGroup();
  if (jump && !(hits.get(curGroup) > 0)) {     // 当前分类无命中 → 跳到首个命中的分类
    const first = [...hits.keys()][0];
    if (first) curGroup = first;
  }
  if (!groupList().some(([g]) => g === curGroup)) curGroup = groupList()[0]?.[0] ?? null;
  renderNav(hits);
  renderGroup();
}

async function loadSettings() {
  const r = await fetch('/api/settings').then(x => x.json());
  if (r.error) { toast(r.error, true); return; }
  groupMap = r.groupmap || {};
  settingsCache = r.items;
  for (const it of settingsCache) it.group = groupNameFor(it.key, it.group);
  applyFilter(false);
  document.getElementById('q').oninput = () => applyFilter(true);
  document.getElementById('onlyCustom').onchange = () => applyFilter(true);
}

function renderNav(hits) {
  const filtering = isFiltering();
  const nav = document.getElementById('group-nav');
  nav.innerHTML = '';
  for (const [g, total] of groupList()) {
    const hit = hits.get(g) || 0;
    const d = document.createElement('div');
    d.className = 'nav-item' + (g === curGroup ? ' active' : '') + (filtering && !hit ? ' dim' : '');
    d.title = `${g}（${total} 项）`;
    const nm = document.createElement('span');
    nm.className = 'gname'; nm.textContent = g;
    const c = document.createElement('span');
    c.className = 'cnt'; c.textContent = filtering ? hit : total;
    d.append(nm, c);
    d.onclick = () => { curGroup = g; renderNav(hitsByGroup()); renderGroup(); };
    nav.appendChild(d);
  }
}

function renderGroup() {
  const filtering = isFiltering();
  const box = document.getElementById('settings');
  box.innerHTML = '';
  if (!curGroup) return;
  const rows = filtered().filter(it => it.group === curGroup);
  const total = (groupList().find(([g]) => g === curGroup) || [null, 0])[1];
  const h = document.createElement('div');
  h.className = 'grp';
  h.innerHTML = `<span class="grp-name"></span><small></small>`;
  h.querySelector('.grp-name').textContent = curGroup;
  h.querySelector('small').textContent = filtering ? `${rows.length} / ${total} 项命中` : `${total} 项`;
  box.appendChild(h);
  for (const it of rows) box.appendChild(settingRow(it));
  if (!rows.length) {
    const e = document.createElement('div');
    e.className = 'empty-hint';
    e.textContent = '该分类下无匹配设置项';
    box.appendChild(e);
  }
  document.getElementById('count').textContent = `${filtered().length} / ${settingsCache.length} 项`;
}

function settingRow(it) {
  const div = document.createElement('div');
  div.className = 'row';
  const head = document.createElement('div');
  head.className = 'head';
  const badge = document.createElement('span');
  if (it.custom) { badge.className = 'badge custom'; badge.textContent = '已自定义'; }
  else { badge.className = 'badge default'; badge.textContent = '默认值'; }
  if (!it.editable) {
    badge.className = 'badge ro';
    badge.textContent = '只读（数组/嵌套）';
  }
  head.innerHTML = `<span class="zhname"></span><span class="key"></span>`;
  head.querySelector('.zhname').textContent = it.name || it.key.split('.').pop();
  head.querySelector('.key').textContent = it.key;
  head.appendChild(badge);

  let input;
  const cur = it.value === null || it.value === undefined ? '' : String(it.value);
  if (!it.editable) {
    input = document.createElement('input');
    input.type = 'text'; input.disabled = true; input.value =
      it.value === undefined ? '(无)' : JSON.stringify(it.value);
  } else if (it.type === 'boolean') {
    input = document.createElement('select');
    for (const [v, label] of [['true','true（开）'], ['false','false（关）']]) {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (cur === v) o.selected = true;
      input.appendChild(o);
    }
  } else if (it.options && it.options.length) {
    input = document.createElement('select');
    for (const v of it.options) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      if (cur === v) o.selected = true;
      input.appendChild(o);
    }
    if (![...input.options].some(o => o.value === cur)) {
      const o = document.createElement('option');
      o.value = cur; o.textContent = cur + '（当前）'; o.selected = true;
      input.prepend(o);
    }
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.value = cur;
  }
  head.appendChild(input);

  const save = document.createElement('button');
  save.className = 'save'; save.textContent = '保存';
  if (!it.editable) save.disabled = true;
  save.onclick = async () => {
    const r = await fetch('/api/set-key', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: it.key, value: input.value})}).then(x => x.json());
    if (r.ok) toast(`${it.key} → ${input.value}（已备份，写后 omp 即时生效）`);
    else { toast('失败: ' + r.error, true); return; }
    const y = window.scrollY;
    await loadSettings();
    window.scrollTo(window.scrollX, y); // 保持滚动位置
  };
  head.appendChild(save);
  div.appendChild(head);

  const desc = document.createElement('div');
  desc.className = 'desc';
  const TYPE_ZH = {boolean:'布尔', number:'数字', integer:'数字', string:'字符串',
                   enum:'枚举', array:'数组', record:'键值表'};
  const bits = [it.zh || it.key.split('.').pop()];
  bits.push(`类型: ${TYPE_ZH[it.type] ?? it.type}`);
  desc.textContent = bits.join(' · ');
  if (it.desc) desc.title = it.desc; // 英文原文悬停可见
  div.appendChild(desc);
  return div;
}

load();
</script>
</body>
</html>
